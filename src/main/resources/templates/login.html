<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/avatar.svg}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/assets/css/main.css}">
</head>

<body>
<div class="login-wrapper">
    <div class="login-bg-shape login-bg-shape-1"></div>
    <div class="login-bg-shape login-bg-shape-2"></div>

    <div class="login-card">
        <a th:href="@{/login}" class="login-brand text-decoration-none">
            <i class="bi bi-bag-heart-fill"></i>
        </a>

        <p class="login-subtitle">Đăng nhập để tiếp tục</p>

        <div id="feedback" class="alert-custom alert-custom-danger mb-3 d-none" role="alert">
            <i class="bi bi-exclamation-triangle-fill alert-custom-icon"></i>
            <div id="feedbackMessage" class="alert-custom-content"></div>
        </div>

        <div th:if="${param.logout}" class="alert-custom alert-custom-success mb-3">
            <i class="bi bi-check-circle-fill alert-custom-icon"></i>
            <div class="alert-custom-content">Bạn đã đăng xuất.</div>
        </div>

        <form th:action="@{/auth/login}" method="post" id="loginForm" accept-charset="UTF-8">
            <div class="login-form-group">
                <label for="email" class="login-form-label">Email</label>
                <div class="login-input-group">
                    <i class="bi bi-person input-icon"></i>
                    <input type="email"
                           id="email"
                           name="email"
                           class="login-input"
                           placeholder="name@company.com"
                           autocomplete="username"
                           required
                           autofocus>
                </div>
            </div>

            <div class="login-form-group">
                <label for="password" class="login-form-label">Mật khẩu</label>
                <div class="login-input-group">
                    <i class="bi bi-shield-lock input-icon"></i>
                    <input type="password"
                           id="password"
                           name="password"
                           class="login-input login-input-password"
                           placeholder="••••••••"
                           autocomplete="current-password"
                           required>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btn-submit">
                <span>Đăng nhập</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <p class="login-footer-text">
            <a th:href="@{/login}"><i class="bi bi-arrow-left"></i> Về trang đăng nhập</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script th:src="@{/js/mainjs.js}"></script>
</body>
</html>
